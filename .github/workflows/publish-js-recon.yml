# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish JS Recon

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  version_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version mismatch
        run: |
          echo "[i] Checking if the version in the CHANGELOG.md, package.json, and Github release version matches"
          PACKAGE_JSON_VERSION=$(cat package.json | jq ".version" -r)
          CHANGELOG_VERSION=$(cat CHANGELOG.md | grep -E "^## [0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?" | head -n 1 | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?).*/\1/')
          GITHUB_RELEASE_VERSION=$(echo $GITHUB_RELEASE_VERSION_RAW | sed -E 's/^[[:space:]]*v//')
          GLOBALS_FILE_VERSION=$(grep -E '^const version =.+' src/globalConfig.ts | sed -E 's/^const version = "(.*)";/\1/')
          if [[ "$PACKAGE_JSON_VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "Version number mismatch between PACKAGE_JSON_VERSION and CHANGELOG_VERSION"
            exit 1
          elif [[ "$PACKAGE_JSON_VERSION" != "$GITHUB_RELEASE_VERSION" ]]; then
            echo "Version number mismatch between PACKAGE_JSON_VERSION and GITHUB_RELEASE_VERSION"
            exit 1
          elif [[ "$PACKAGE_JSON_VERSION" != "$GLOBALS_FILE_VERSION" ]]; then
            echo "Version number mismatch between PACKAGE_JSON_VERSION and GLOBALS_FILE_VERSION"
            exit 1
          else
            echo "[✓] Version matches"
          fi
        env:
          GITHUB_RELEASE_VERSION_RAW: ${{ github.event.release.tag_name }}


  audit:
    needs: version_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Run npm audit
        run: npm audit

  build:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run test

  depx-audit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify depx (SHA256-pinned)
        run: |
          set -euo pipefail
          VERSION="0.1.1"
          EXPECTED_SHA256="9f00c8133369eb75741a1ed52eb0d4102f965b1da413b09f190332981264338f"
          URL="https://github.com/projectdiscovery/depx/releases/download/v${VERSION}/depx_${VERSION}_linux_amd64.zip"
          curl -sSL -o depx.zip "$URL"
          ACTUAL_SHA256=$(sha256sum depx.zip | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "depx binary SHA256 mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256"
            exit 1
          fi
          unzip -q depx.zip -d depx-bin
          chmod +x depx-bin/depx
          echo "$PWD/depx-bin" >> "$GITHUB_PATH"
      - name: Run depx audit against package-lock.json
        run: depx audit package-lock.json --require-clean

  publish-npm:
    needs:
      - build
      - depx-audit
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Stage release to npm via OIDC
        run: |
          TAG="latest"
          [[ "$VERSION" == *"beta"* ]] && TAG="beta"
          [[ "$VERSION" == *"alpha"* ]] && TAG="alpha"
          npm stage publish --tag $TAG
        env:
          VERSION: ${{ github.event.release.tag_name }}

  merge_main_and_dev:
    needs:
      - publish-npm
    runs-on: ubuntu-latest
    environment: commit-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure SSH commit signing
        uses: shriyanss/verified-commit-action@1d7638e44a6bab6d3ac35653af7ef9f343074662 # v1.0.2
        with:
          ssh-private-key: ${{ secrets.JS_RECON_SIGNING_KEY }}
          commit-name: "js-recon-bot"
          commit-email: ${{ secrets.JS_RECON_SIGNING_EMAIL }}
      - name: Merge main and dev
        run: |
          git fetch origin main:main
          git fetch origin dev:dev
          git checkout dev
          git merge --no-ff -m "chore: merge changes after release $VERSION" main -X theirs || (git status && git diff && exit 0)
          git push origin dev
        env:
          VERSION: ${{ github.event.release.tag_name }}
